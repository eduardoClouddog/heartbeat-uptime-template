# monitoring/values.yaml

replicas: 1

apps:
  - name: app1
    secretName: heartbeat-secret-app1
    secretData:
      SERVICE_URL: "http://internal-app.default.svc.cluster.local:8080"
      HEARTBEAT_URL: "https://uptime.com/ping/app1-xyz"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi

  - name: app2
    secretName: heartbeat-secret-app2
    secretData:
      SERVICE_URL: "http://internal-app2.default.svc.cluster.local:8080"
      HEARTBEAT_URL: "https://uptime.com/ping/app2-abc"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi

  - name: backend
    secretName: heartbeat-secret-backend-app
    secretData:
      SERVICE_URL: "http://backend-app.backend.svc.cluster.local:5000"
      HEARTBEAT_URL: "https://uptime.com/ping/backend-123"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
