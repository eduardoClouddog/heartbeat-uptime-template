image:
  repository: 762593866570.dkr.ecr.us-east-1.amazonaws.com/heartbeat-uptime
  tag: latest
imagePullSecrets:
  - name: ecr-registry

# Contexto de segurança padrão
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Esta lista vem vazia por padrão.
# Ela será preenchida pelo ArgoCD para cada cliente.
apps: []

