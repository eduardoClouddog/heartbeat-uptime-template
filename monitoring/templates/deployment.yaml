{{/* templates/deployment.yaml */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-uptime
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: heartbeat-uptime
  template:
    metadata:
      labels:
        app: heartbeat-uptime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      {{- range .Values.apps }}
        - name: {{ .name }}

          image: "curlimages/curl:latest"

          envFrom:
            - secretRef:
                name: {{ .secretName }}

          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/binsh

              echo "Iniciando monitoramento para $SERVICE_URL..."

              while true; do
                if curl -fsS "$SERVICE_URL" > /dev/null; then
                  echo "$(date) - Serviço OK."
                  curl -fsS "$HEARTBEAT_URL"
                else
                  echo "$(date) - heartbeat NÃO enviado"
                fi
                sleep 60
              done

          resources:
            {{- toYaml .resources | nindent 12 }}
      {{- end }}
