{{/* templates/deployment.yaml */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-heartbeat
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: uptime-heartbeat
  template:
    metadata:
      labels:
        app: uptime-heartbeat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      # A lista de containers é construída dinamicamente
      containers:
      {{- range .Values.apps }}
        - name: {{ .name }}
          # Usa a imagem global definida no values.yaml
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"

          # Injeta as variáveis de ambiente a partir de um Secret
          # O nome do Secret vem da lista 'apps'
          envFrom:
            - secretRef:
                name: {{ .secretName }}

          # Define os recursos para este container específico
          resources:
            {{- toYaml .resources | nindent 12 }}
      {{- end }}
