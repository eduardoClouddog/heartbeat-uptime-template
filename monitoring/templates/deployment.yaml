{{/* templates/deployment.yaml */}}
{{- range .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-{{ .name }}
  labels:
    app.kubernetes.io/name: heartbeat-{{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: heartbeat-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartbeat-{{ .name }}
    spec:
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: heartbeat-monitor
          # O '$.Values' acessa os valores globais (fora do 'range')
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          envFrom:
            - configMapRef:
                # Injeta o ConfigMap específico deste app
                name: heartbeat-config-{{ .name }}
          resources:
            {{- toYaml .resources | nindent 12 }}
{{- end }}
